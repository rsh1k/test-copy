name: dotCMS Security Analysis

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze_vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Fetch all history so rebasing/merging works correctly
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install anthropic requests

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dotcms/dotcms:latest'
          format: 'json'
          output: 'trivy-results.json'

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: dotcms/dotcms:latest
          format: json
          output: scout-results.json
        env:
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate AI Report
        run: python scripts/analyze.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEMGREP_API_TOKEN: ${{ secrets.SEMGREP_API_TOKEN }}
          SEMGREP_ORG_NAME: "dotcms1"

      - name: Commit and Push Report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Security Report from Semgrep Cloud & SCA [skip ci]"
          file_pattern: 'private_issue.md'
          # This handles the 'non-fast-forward' error by forcing the push
          push_options: '--force' 
          # Alternatively, you can use '--force-with-lease' for more safety
